<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1C232B"><meta name="color-scheme" content="dark">
<title>Vigia · Aprovação</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>

:root{
 --noite:#1C232B;--noite2:#252E38;--azulejo:#EEF2F1;--rejunte:#D9E0DE;--tinta:#1A1F24;--tinta2:#4A5560;--tinta3:#7B8690;
 --etiqueta:#F4C430;--etiqueta2:#E2B21E;--liberado:#1F7A52;--recusa:#B3372D;--espera:#8A6A12;
 --ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1)}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--etiqueta);outline-offset:3px;border-radius:8px}
html,body{height:100%;overflow:hidden}
body{font-family:Archivo,system-ui,sans-serif;font-variation-settings:"wdth" 100;color:#fff;-webkit-font-smoothing:antialiased;
 background-color:var(--noite);
 background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:56px 56px}
svg{display:block}
/* ---------- topo ---------- */
.top{position:fixed;inset:0 0 auto 0;height:64px;z-index:20;display:flex;align-items:center;gap:18px;padding:0 28px}
.marca{font-weight:800;font-size:18px;font-variation-settings:"wdth" 125;letter-spacing:-.01em}
.filtros{display:flex;gap:4px;overflow:auto;scrollbar-width:none;min-width:0}.filtros::-webkit-scrollbar{display:none}
.filtro{white-space:nowrap;font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:8px;color:#ffffffa8;transition:color .15s ease,background-color .15s ease}
.filtro .n{font-variant-numeric:tabular-nums;color:#ffffff60;margin-left:6px}
.filtro[aria-pressed=true]{background:#ffffff14;color:#fff}.filtro[aria-pressed=true] .n{color:var(--etiqueta)}
@media(hover:hover) and (pointer:fine){.filtro:hover{color:#fff}}
.contagem{margin-left:auto;font-size:13.5px;color:#ffffff99;white-space:nowrap;font-variant-numeric:tabular-nums}
.contagem strong{color:#fff;font-weight:700}
/* ---------- trilho ---------- */
.palco{position:fixed;inset:72px 0 64px 0;z-index:1}
.trilho{height:100%;display:flex;transition:transform 240ms var(--ease-out)}
.slot{flex:0 0 min(1200px,calc(100% - 150px));height:100%;padding:0 10px;transition:opacity 200ms ease}
.slot[aria-hidden=true]{opacity:.28}
.slide{height:100%;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
 background:var(--azulejo);color:var(--tinta);border-radius:20px;overflow:hidden;position:relative;
 box-shadow:0 1px 0 #ffffff1a inset,0 40px 80px -30px #000000c0;transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out)}
.slide.sai{opacity:0;transform:translateY(-24px) scale(.98)}
/* carimbo */
.carimbo{position:absolute;left:50%;top:42%;z-index:8;pointer-events:none;font-weight:800;font-size:44px;font-variation-settings:"wdth" 125;
 padding:6px 26px 8px;border:5px solid currentColor;border-radius:12px;opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(1.18);
 transition:opacity 140ms var(--ease-out),transform 160ms var(--ease-out);mix-blend-mode:multiply}
.carimbo.on{opacity:.92;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}
/* ---------- imagem ---------- */
.vis{background:#11161B;display:flex;flex-direction:column;min-height:0;min-width:0}
.foto{flex:1;position:relative;min-height:0;overflow:hidden;display:block;width:100%;cursor:zoom-in}
.foto>svg,.foto>img{width:100%;height:100%;object-fit:cover}
.foto .legenda{position:absolute;left:16px;bottom:14px;font-size:13px;font-weight:600;color:#fff;background:#0b0f13b3;padding:5px 11px;border-radius:7px}
.foto .legenda span{color:#ffffff99;font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}
.risco{position:absolute;right:14px;top:14px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:7px;color:var(--tinta)}
.tiras{display:flex;gap:8px;padding:10px 14px 12px;align-items:center;min-width:0}
.tira{width:72px;height:50px;border-radius:7px;overflow:hidden;flex:none;opacity:.5;outline-offset:2px;transition:opacity .15s ease}
.tira[aria-current=true]{opacity:1;box-shadow:0 0 0 2px #fff}
.tira svg,.tira img{width:100%;height:100%;object-fit:cover}
.tiras .graf{flex:1;min-width:0;margin-left:6px}
.grafsolo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 40px}
/* ---------- texto ---------- */
.txt{padding:30px 34px 18px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.de{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--tinta2);font-weight:500;margin-bottom:14px}
.de .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.de time{margin-left:auto;color:var(--tinta3);font-variant-numeric:tabular-nums}
.slide h2{font-size:30px;line-height:1.08;font-weight:750;font-variation-settings:"wdth" 118;letter-spacing:-.015em;text-wrap:balance}
.ctx{color:var(--tinta2);font-size:15px;line-height:1.5;margin:12px 0 18px;max-width:58ch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.sai{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 0 0 1px var(--rejunte)}
.sai .para{font-size:13px;color:var(--tinta3);margin-bottom:6px;display:flex;gap:8px}
.sai .para b{color:var(--tinta2);font-weight:600}.sai .para em{font-style:normal;margin-left:auto;color:#2f5fd0;font-weight:600}
.sai .corpo{font-size:15px;line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
.sai textarea{width:100%;min-height:128px;border:0;outline:2px solid #2f5fd0;border-radius:8px;font:inherit;font-size:15px;line-height:1.5;padding:8px;resize:vertical;background:#fff;color:var(--tinta)}
.estado{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.estado span{padding:4px 10px;border-radius:7px;background:var(--azulejo)}.estado span:last-child{background:#dff1e8;color:var(--liberado)}
.fatos{display:flex;margin-top:20px;border-top:1px solid var(--rejunte);padding-top:14px}
.fato{flex:1;min-width:0;padding-right:12px}.fato+.fato{padding-left:14px;border-left:1px solid var(--rejunte)}
.fato b{display:block;font-size:24px;font-weight:750;font-variation-settings:"wdth" 112;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1}
.fato span{font-size:12.5px;color:var(--tinta3);line-height:1.3;display:block;margin-top:2px}
.hist{margin-top:auto;padding-top:14px;font-size:13px;color:var(--tinta2);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.hist time{color:var(--tinta3);font-variant-numeric:tabular-nums}
/* ---------- etiqueta de decisão (o elemento ousado) ---------- */
.etq{grid-column:1/-1;background:var(--etiqueta);display:flex;align-items:center;gap:10px;padding:14px 22px 14px 20px;position:relative;
 background-image:repeating-linear-gradient(-45deg,transparent 0 22px,#00000008 22px 23px)}
.ilhos{width:22px;height:22px;border-radius:50%;background:var(--noite);box-shadow:0 0 0 4px #c99a12,inset 0 2px 3px #000a;flex:none;margin-right:6px}
.etq .pergunta{font-weight:750;font-size:16px;font-variation-settings:"wdth" 112;color:var(--tinta);margin-right:6px;white-space:nowrap}
.op{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;font-weight:650;font-size:15px;color:var(--tinta);text-align:left;
 background:#ffffff73;transition:transform 160ms var(--ease-out),background-color .15s ease}
.op small{display:block;font-size:12px;font-weight:500;color:var(--tinta2)}
.op kbd{font:700 12px Archivo;min-width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:#00000014;color:var(--tinta2);flex:none}
.op.principal{background:var(--tinta);color:#fff}.op.principal small{color:#ffffffa8}.op.principal kbd{background:#ffffff26;color:#fff}
.op:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.op:hover{background:#ffffffb3}.op.principal:hover{background:#000}}
.etq .resto{margin-left:auto;display:flex;gap:6px}
.op.leve{background:transparent;padding:10px 12px}.op.leve.rec{color:var(--recusa)}
@media(hover:hover) and (pointer:fine){.op.leve:hover{background:#00000010}}
/* ---------- navegação e rodapé ---------- */
.seta{position:fixed;top:50%;z-index:15;width:44px;height:44px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;transform:translateY(-50%);transition:background-color .15s ease,transform 160ms var(--ease-out)}
.seta:active{transform:translateY(-50%) scale(.95)}@media(hover:hover) and (pointer:fine){.seta:hover{background:#ffffff26}}
.seta.e{left:20px}.seta.d{right:20px}.seta[disabled]{opacity:.25;cursor:default}
.rodape{position:fixed;inset:auto 0 0 0;height:64px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:13px;color:#ffffff80;z-index:20}
.rodape kbd{font:600 12px Archivo;border:1px solid #ffffff38;border-radius:5px;padding:1px 6px;margin-right:5px;color:#fff}
.amostra{position:fixed;left:24px;bottom:22px;font-size:12px;color:#ffffff59;z-index:20}
/* aviso + desfazer */
.aviso{position:fixed;left:50%;bottom:76px;z-index:60;transform:translate(-50%,12px);opacity:0;background:#fff;color:var(--tinta);border-radius:12px;
 padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14.5px;font-weight:600;box-shadow:0 16px 40px #0007;
 transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out);pointer-events:none}
.aviso.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.aviso button{padding:7px 12px;border-radius:8px;background:var(--azulejo);font-weight:700}
/* gráfico */
.graf{position:relative}.graf .tt{position:absolute;pointer-events:none;background:#fff;color:var(--tinta);font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:6px;transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity 100ms ease;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px #0004}
.graf .fonte{font-size:12px;color:#ffffff80;margin-top:6px}
/* tela cheia */
#lb{position:fixed;inset:0;z-index:50;background:#0b0f13;display:none;flex-direction:column;overscroll-behavior:contain}
#lb.on{display:flex}
#lb .lbt{display:flex;align-items:center;gap:12px;padding:16px 22px;font-size:15px;font-weight:600}#lb .lbt span{color:#ffffff8a;font-weight:500}
#lb .x{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center}
#lb .area{flex:1;display:flex;align-items:center;justify-content:center;padding:0 76px 20px;min-height:0;position:relative}
#lb .area>svg{width:min(1000px,100%);height:auto;max-height:100%;border-radius:12px}#lb .area>img{max-width:100%;max-height:100%;border-radius:12px}
#lb iframe{width:min(1100px,100%);height:100%;border:0;background:#fff;border-radius:12px}
#lb .doc{background:#fff;color:#111;width:min(640px,100%);height:100%;overflow:auto;padding:40px 46px;font-size:14px;line-height:1.6;border-radius:12px}
#lb .nv{position:absolute;top:50%;width:46px;height:46px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;transform:translateY(-50%)}#lb .nv.e{left:16px}#lb .nv.d{right:16px}
#lb .tiras{justify-content:center;padding-bottom:18px}
.fim{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#ffffffb0;text-align:center;font-size:15px}
.fim b{font-size:34px;color:#fff;font-variation-settings:"wdth" 125}
@media(max-width:900px){.slide{grid-template-columns:1fr;grid-template-rows:30% minmax(0,1fr) auto}.op small,.op kbd,.ilhos,.etq .pergunta{display:none}.etq{padding:10px 12px;gap:6px}.op{padding:9px 12px;font-size:14px}.etq .resto{margin-left:0}.tiras{padding:6px 10px}.tira{width:54px;height:38px}.tiras .graf{display:none}.slot{flex-basis:calc(100% - 36px)}.seta,.contagem,.rodape,.amostra{display:none}.palco{bottom:12px}
 .slide h2{font-size:22px}.txt{padding:18px 18px 10px}.fatos .fato:nth-child(n+3){display:none}.etq{flex-wrap:wrap}.etq .pergunta{width:100%}.hist{display:none}}
.slide.c1 .hist{display:none}
.slide.c2 .ctx{-webkit-line-clamp:2;margin:8px 0 12px}.slide.c2 .sai .corpo{-webkit-line-clamp:4}.slide.c2 .fatos{margin-top:12px;padding-top:10px}
.slide.c3 .fatos{display:none}.slide.c3 h2{font-size:clamp(20px,2.2vw,26px)}
.slide.c4 .ctx{display:none}.slide.c4 .sai .corpo{-webkit-line-clamp:3}
@media(prefers-reduced-motion:reduce){.trilho,.slide,.carimbo,.aviso{transition:opacity 150ms ease!important}.slide.sai{transform:none}.carimbo,.carimbo.on{transform:translate(-50%,-50%) rotate(-7deg)}}

.painel-link{font-size:13.5px;color:#ffffffa8;text-decoration:none;padding:7px 12px;border-radius:8px;white-space:nowrap}
@media(hover:hover){.painel-link:hover{color:#fff;background:#ffffff14}}
.semmidia{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:40px;color:#ffffffc8}
.semmidia .grande{font-size:56px;font-weight:800;font-variation-settings:"wdth" 125;line-height:1;color:#fff}
.semmidia a{color:var(--etiqueta);font-weight:600}
.doc-thumb{width:100%;height:100%;display:grid;place-items:center;background:#0f1418;color:#fff;font-size:15px;font-weight:600}
.doc-thumb span{display:block;font-size:56px;margin-bottom:8px;text-align:center}
.erro-api{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:30;background:#B3372D;color:#fff;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;display:none}
.tiras{overflow-x:auto;scrollbar-width:thin}.tira.mais{display:grid;place-items:center;background:#ffffff14;color:#fff;font-weight:700;font-size:14px;opacity:1}
.carregando{position:absolute;inset:0;display:grid;place-items:center;color:#ffffffa0;font-size:14px}
.vthumb{position:relative;display:block;width:100%;height:100%}.vthumb video{width:100%;height:100%;object-fit:cover;display:block;background:#000}.vthumb i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;color:#fff;font-size:28px;text-shadow:0 2px 10px #000a}.tira .vthumb i{font-size:14px}
.etq .op{white-space:nowrap}.etq .op.leve{padding:10px 8px}
.pareceres:empty{display:none}.pareceres{display:grid;gap:6px;margin:-6px 0 14px}.pc{border-left:3px solid #3651B8;background:#E7ECF7;border-radius:0 8px 8px 0;padding:6px 10px}.pc b{font-size:12.5px}.pc .vd{font-size:11.5px;font-weight:700;margin-left:8px;padding:1px 7px;border-radius:5px;background:#fff;color:#3651B8}.pc p{font-size:13px;color:var(--tinta2);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.slide.c1 .pc p{-webkit-line-clamp:1}
@media(max-width:1440px){.etq .pergunta{display:none}.etq .op.leve kbd{display:none}.etq{gap:6px;padding:12px 14px}.etq .op{padding:9px 12px}.etq .op.leve{padding:9px 6px}}
#gaveta{position:fixed;inset:0;z-index:55;background:#0b0f13cc;display:none;justify-content:flex-end}#gaveta.on{display:flex}
#gaveta .g{width:min(560px,100%);height:100%;background:var(--azulejo);color:var(--tinta);overflow:auto;padding:22px 24px}
#gaveta h3{font-size:22px;font-variation-settings:"wdth" 118;margin-bottom:4px}#gaveta .sub{color:var(--tinta3);font-size:13.5px;margin-bottom:16px}
#gaveta .it{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 0 0 1px var(--rejunte)}
#gaveta .it b{display:block;font-size:14.5px}#gaveta .it p{font-size:13px;color:var(--tinta2);margin:4px 0 8px;white-space:pre-wrap;max-height:110px;overflow:auto}
#gaveta .it .ac{display:flex;gap:8px;align-items:center}#gaveta .it .ac button,#gaveta .it .ac a{font-size:13px;font-weight:650;padding:6px 12px;border-radius:8px;background:var(--azulejo);color:var(--tinta);text-decoration:none}
#gaveta .it .ac button.f{background:var(--tinta);color:#fff}#gaveta .fechar{float:right;font-size:14px;padding:6px 10px;border-radius:8px;background:#fff}
#gaveta .lote-it{display:flex;gap:10px;align-items:flex-start}#gaveta .lote-it input{margin-top:4px;width:18px;height:18px}
.qd-img{width:100%;height:100%;object-fit:contain;background:#0b0f13;display:block}.qd-wait{position:absolute;inset:0;display:grid;place-items:center;color:#ffffffa0;font-size:14px}
.lbv{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%;max-height:100%}.lbv .qd-img{max-height:calc(100vh - 220px);width:auto;max-width:100%;border-radius:12px}
.problemas{position:fixed;left:24px;bottom:44px;z-index:20;font-size:12px;color:#F4C430}
</style></head><body>
<header class="top"><span class="marca">Vigia</span><nav class="filtros" id="filtros" aria-label="Filtrar por agente"></nav>
<p class="contagem" id="contagem" aria-live="polite"></p><button class="painel-link" id="btn-pend">Pendências <b id="n-pend">0</b></button><a class="painel-link" href="/painel">Painel dos agentes</a></header>
<div class="erro-api" id="erro" role="alert"></div>
<main class="palco" aria-roledescription="carrossel" aria-label="Pedidos para aprovar"><div class="trilho" id="trilho"></div></main>
<button class="seta e" id="ant" aria-label="Pedido anterior"></button><button class="seta d" id="prox" aria-label="Próximo pedido"></button>
<footer class="rodape"><span><kbd>←</kbd><kbd>→</kbd>passar</span><span><kbd>1</kbd><kbd>2</kbd>escolher</span><span><kbd>O</kbd>outra ação</span><span><kbd>E</kbd>editar</span><span><kbd>R</kbd>recusar</span><span><kbd>L</kbd>depois</span><span><kbd>Espaço</kbd>ver o anexo inteiro</span></footer>
<p class="problemas" id="problemas"></p>
<div id="gaveta" role="dialog" aria-modal="true"><div class="g" id="gav"></div></div>
<div class="aviso" id="aviso" role="status" aria-live="polite"><span id="aviso-t"></span><button id="desfazer">Desfazer</button></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Anexo em tela cheia"><div class="lbt" id="lbt"></div><div class="area" id="lba"></div><div class="tiras" id="lbm"></div></div>
<script>
const API=null;
const I={
l:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
r:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
let FONTE={slack:['#7D3C98','#','Slack'],gmail:['#B3372D','@','Gmail'],suporte:['#3651B8','?','Suporte'],vigia:['#1F7A52','V','Vigia'],doc:['#3651B8','▤','Página']};
const RISCO={producao:['Mexe em produção','#F6D8C2'],envio_externo:['Sai para fora','#E6D3F0'],dinheiro:['Dinheiro','#F3C9C4'],saude:['Agente com problema','#F3C9C4'],interno:['Interno','#D6DEF5']};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const urlOk=u=>/^(https?:|\/midia\/|data:image\/)/.test(u||'')?u:'';
const $=s=>document.querySelector(s);
let ITENS=[],filtro=null,atual=0,pg={},pend=null,RES={esperando:0,decididos_hoje:0};
const chave=p=>p.agente+'/'+p.id;
const vis=()=>ITENS.filter(p=>!p.pendencia&&!(pend&&pend.k===chave(p))&&(!filtro||(p.departamento||p.agente_nome||'')===filtro));
const pends=()=>ITENS.filter(p=>p.pendencia);
async function api(caminho,corpo){const r=await fetch(caminho,{method:corpo?'POST':'GET',headers:{'X-Vigia-Token':API?API.token:'','Content-Type':'application/json'},body:corpo?JSON.stringify(corpo):undefined,keepalive:!!corpo});

 (P.length?P.map(p=>`<div class="it" data-k="${esc(chave(p))}"><b>${esc(p.titulo)}</b><small style="color:var(--tinta3)">${esc(p.departamento||'')} · ${esc(p.agente_nome)} · ${quando(p.criado_em)}</small><p>${esc(p.proposta.previa||p.contexto||'')}</p><div class="ac"><button class="f" data-feito>Feito</button>${urlOk((p.entrada||{}).link)?`<a href="${esc(p.entrada.link)}" target="_blank" rel="noopener">Abrir a origem</a>`:''}</div></div>`).join(''):'<p>Nenhuma pendência.</p>');
 $('#gav').querySelectorAll('[data-feito]').forEach(b=>b.onclick=async()=>{const it=b.closest('.it'),p=porK(it.dataset.k);b.disabled=true;
  try{await api(`/api/pedido/${encodeURIComponent(p.agente)}/${encodeURIComponent(p.id)}/aprovar`,{opcao:0});ITENS=ITENS.filter(x=>x!==p);it.remove();topo()}catch(e){erro(e.message);b.disabled=false}});
 $('#gaveta').classList.add('on')}
$('#btn-pend').onclick=abrePend;
function lote(p){const L=ITENS.filter(x=>!x.pendencia&&x.lote===p.lote);if(L.length<2)return;
 $('#gav').innerHTML=`<button class="fechar" onclick="fechaGav()">Fechar</button><h3>Aprovar ${L.length} iguais</h3><p class="sub">${esc(p.proposta.rotulo)} · ${esc(p.agente_nome)}. Cada um sai com o próprio texto. Desmarque o que não quiser.</p>`+
  L.map(x=>`<label class="it lote-it"><input type="checkbox" checked data-k="${esc(chave(x))}"><span><b>${esc(x.titulo)}</b><p>${esc(x.proposta.previa||'')}</p></span></label>`).join('')+
  `<button class="op principal" id="lote-ok" style="width:100%;justify-content:center;margin-top:6px">Aprovar os marcados</button>`;
 $('#lote-ok').onclick=async()=>{const ks=[...$('#gav').querySelectorAll('input:checked')].map(i=>i.dataset.k);$('#lote-ok').disabled=true;let ok=0,falha=[];
  for(const k of ks){const x=porK(k);try{await api(`/api/pedido/${encodeURIComponent(x.agente)}/${encodeURIComponent(x.id)}/aprovar`,{opcao:0});ok++;ITENS=ITENS.filter(y=>y!==x)}catch(e){falha.push(x.titulo+': '+e.message)}}
  RES.decididos_hoje+=ok;fechaGav();render();aviso(`Aprovados ${ok} de ${ks.length}${falha.length?' · '+falha.length+' com erro':''}`,false);if(falha.length)erro(falha.join(' | '))};
 $('#gaveta').classList.add('on')}

const QD={};
function quadrosImg(p,i){const k=chave(p)+'|'+i;const u=QD[k];return u&&u!=='erro'&&u!=='…'?`<img class="qd-img" src="${esc(u)}" alt="8 quadros do vídeo">`:`<span class="qd-wait" data-q="${esc(k)}">${u==='erro'?'Não consegui montar os quadros: use Tocar o vídeo':'Montando os quadros do vídeo…'}</span>`}
async function carregaQuadros(){for(const el of document.querySelectorAll('[data-q]')){const k=el.dataset.q;if(QD[k])continue;QD[k]='…';const[ck,i]=k.split('|');const[ag,...rest]=ck.split('/');const id=rest.join('/');
 try{const j=await api(`/api/quadros/${encodeURIComponent(ag)}/${encodeURIComponent(id)}/${i}`);QD[k]=j.url}catch(e){QD[k]='erro'}
 document.querySelectorAll(`[data-q="${CSS.escape(k)}"]`).forEach(x=>{x.outerHTML=QD[k]==='erro'?'<span class="qd-wait">Não consegui montar os quadros: use Tocar o vídeo</span>':`<img class="qd-img" src="${esc(QD[k])}" alt="8 quadros do vídeo">`})}}
setInterval(()=>{if(document.querySelector('[data-q]'))carregaQuadros()},1500);
carregar();setInterval(()=>{if(!pend&&!document.querySelector('.sai textarea')&&!$('#lb').classList.contains('on')&&!$('#gaveta').classList.contains('on'))carregar()},60000);
</script></body></html>
