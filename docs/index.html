<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Vigia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%2220%22%20fill%3D%22%23fff%22%20stroke%3D%22%23111%22%20stroke-width%3D%224%22/%3E%3Cpath%20d%3D%22M24%2024%20L24%204%20A20%2020%200%200%201%2041.3%2014%20Z%22%20fill%3D%22%23E4572E%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%224.5%22%20fill%3D%22%23111%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Tema neutro do Vigia (padrão do repositório). Para outro visual, copie esta pasta,
   troque os valores e aponte `tema = "caminho/da/pasta"` no vigia.toml. */
:root{
 --bg:#F4F4F1;--sf:#FFFFFF;--sf2:#F1F1EE;--ln:#E3E3DE;--ln2:#C9C9C2;
 --tx:#16181D;--mu:#4E525C;--dim:#6A6E78;
 --pri:#1E2A44;--pri2:#2F5BD3;--linha:#2F5BD3;--pill-tx:#FFFFFF;--varre:#E4572E;
 --ok:#15803D;--late:#B45309;--er:#B91C1C;
 --ok-cel:#22A35A;--late-cel:#F08C1A;--er-cel:#DC2626;--off:#80848D;
 --sel:#EEF1F8;--cel-none:#E6E6E1;--cel-pc:#B3B3AC;--grid:#E3E3DE;--eixo:#6A6E78;--cursor:#80848D;--foco:#16181D;
 --faixa:#2F5BD31A;
 --acao-er-bg:#FEF2F2;--acao-er-ln:#FECACA;--acao-er-tx:#450A0A;--acao-late-bg:#FFF7ED;--acao-late-ln:#FED7AA;--acao-late-tx:#431407;
 --sombra:#16181D40;
 --ease:cubic-bezier(.16,1,.3,1);
 --font:'IBM Plex Sans',ui-sans-serif,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
[data-tema="noite"]{
 --cal-1:#4A1D22;--cal-2:#4A3416;--cal-3:#1C3B2A;--cal-4:#1E6B40;--cal-5:#22A35A;
 --bg:#111317;--sf:#1A1D23;--sf2:#22262D;--ln:#2B3038;--ln2:#3A404A;
 --tx:#ECEDEF;--mu:#A4A9B3;--dim:#878C96;
 --pri:#3B66E0;--pri2:#6E92F0;--linha:#7FA0F4;--pill-tx:#FFFFFF;
 --ok:#4ADE80;--late:#FBA94C;--er:#F87171;
 --ok-cel:#22A35A;--late-cel:#F08C1A;--er-cel:#EF4444;--off:#7A808A;
 --sel:#1E2738;--cel-none:#262A31;--cel-pc:#3E444E;--grid:#2B3038;--eixo:#878C96;--cursor:#A4A9B3;--foco:#ECEDEF;
 --faixa:#7FA0F41F;
 --acao-er-bg:#EF44441A;--acao-er-ln:#F8717140;--acao-er-tx:#ECEDEF;--acao-late-bg:#F08C1A1A;--acao-late-ln:#FBA94C40;--acao-late-tx:#ECEDEF;
 --sombra:#000A;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums;padding:20px 24px;transition:background-color .3s,color .3s}
.wrap{max-width:1400px;margin:auto}
.mono{font-family:var(--mono)}.mu{color:var(--mu)}.dim{color:var(--dim)}
.ok{color:var(--ok)}.late{color:var(--late)}.er,.nr{color:var(--er)}.off,.none{color:var(--off)}.run{color:var(--pri2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--pri2);outline-offset:2px;border-radius:4px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--ln);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mu)}
/* marca */
.topo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.marca{display:flex;align-items:center;gap:12px}
.marca .mk{width:36px;height:36px;flex:none}
.marca .wm{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1}
.marca .end{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;margin-top:3px}
.varre{transform-origin:24px 24px;animation:varre 2.6s cubic-bezier(.45,0,.55,1) 1}
@keyframes varre{from{transform:rotate(-360deg)}to{transform:rotate(0)}}
.marca.alerta .varre{animation:varre 2.6s linear infinite}
.versao{margin-left:auto;font-size:12px;color:var(--dim);text-align:right}
.versao a{color:var(--pri2)}
.novo-v{display:none;background:var(--acao-late-bg);border:1px solid var(--acao-late-ln);color:var(--acao-late-tx);border-radius:9999px;padding:3px 10px;font-size:12px;margin-left:8px}
.tema{display:inline-flex;background:var(--sf);border:1px solid var(--ln);border-radius:9999px;padding:2px}
.tema button{padding:5px 12px;border-radius:9999px;color:var(--mu);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tema button.on{background:var(--pri);color:var(--pill-tx)}
.tema svg{width:14px;height:14px}
/* abas */
.abas{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin:0 0 18px}
.abas button{padding:9px 14px 10px;font-size:14px;font-weight:600;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center}
.abas button.on{color:var(--tx);border-color:var(--pri)}
.abas button:hover{color:var(--tx)}
.abas .ct{font-size:11.5px;font-weight:600;border-radius:9999px;padding:1px 7px;background:var(--sf2);color:var(--mu)}
.abas .ct.er{background:var(--acao-er-bg);color:var(--er)}
.aba{display:none}.aba.on{display:block}
/* visão geral */
.kpis{display:grid;grid-template-columns:1.4fr repeat(4,1fr);background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:16px}
.kpi{padding:16px 18px}.kpi+.kpi{border-left:1px solid var(--ln)}
.kpi .l{font-size:12.5px;color:var(--mu)}.kpi .v{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:2px 0}.kpi .c{font-size:12px;color:var(--dim)}
.kpi .v small{font-size:15px;font-weight:500;color:var(--mu)}
.geral{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.bloco{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin-bottom:16px}
.bloco h3{margin:0;padding:11px 16px;font-size:13px;font-weight:600;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;gap:12px}
.bloco h3 span{font-weight:400;color:var(--dim)}
.pend{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:11px 16px;border-top:1px solid var(--ln);align-items:start;cursor:pointer}
.pend:first-of-type{border-top:0}.pend:hover{background:var(--sf2)}
.pend .n{font-weight:600}.pend .a{font-size:13px;color:var(--mu);margin-top:2px}.pend .a b{font-weight:600;color:var(--tx)}
.pend .ir{font-size:12px;color:var(--pri2);white-space:nowrap;padding-top:2px}
.limpo{padding:16px;color:var(--ok);font-weight:600}
.areas .ar{display:grid;grid-template-columns:minmax(150px,1fr) 150px minmax(0,1.4fr);gap:14px;padding:11px 16px;border-top:1px solid var(--ln);align-items:center;cursor:pointer}
.areas .ar:first-of-type{border-top:0}.areas .ar:hover{background:var(--sf2)}
.ar .nm2{font-weight:600}.ar .nm2 small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.ar .cont{display:flex;gap:10px;font-size:12.5px;flex-wrap:wrap}
.ar .cont span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;height:16px}
.mini i{border-radius:2px;background:var(--cel-none)}
.cal{padding:12px 16px 14px}
.cal .sem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;color:var(--dim);text-align:center;margin-bottom:4px}
.cal .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1.6;border-radius:6px;background:var(--cel-none);position:relative;font-size:11px;color:var(--tx);padding:3px 5px;cursor:default}
.cal .d.vz{background:none}
.cal .d .p{position:absolute;right:5px;bottom:3px;font-weight:600;font-size:11px}
.cal .d.hoje{outline:2px solid var(--tx);outline-offset:1px}
.cal .d.pc{background:repeating-linear-gradient(135deg,var(--cel-pc) 0 2px,var(--cel-none) 2px 5px)}
.cal .leg2{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
.cal .leg2 i{width:18px;height:10px;border-radius:3px;display:inline-block}
.sd{display:grid;grid-template-columns:1fr;}
.sd .s{display:grid;grid-template-columns:16px 170px 1fr;gap:8px;padding:9px 16px;border-top:1px solid var(--ln);font-size:13px;align-items:baseline}
.sd .s:first-of-type{border-top:0}
.sd .s b{font-weight:600}.sd .s>span:last-child{color:var(--mu)}
.prox .p2{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 16px;border-top:1px solid var(--ln);font-size:13px}
.prox .p2:first-of-type{border-top:0}.prox .p2 .t{font-family:var(--mono);font-size:12px;color:var(--mu)}
@media (max-width:1000px){.geral{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(odd){border-left:0}.kpi{border-top:1px solid var(--ln)}}
/* cartões dos agentes (da Central de Agentes) */
.vis{display:inline-flex;background:var(--sf);border:1px solid var(--ln);border-radius:9999px;padding:2px}
.vis button,.filt button{padding:5px 14px;border-radius:9999px;color:var(--mu);font-size:13px}
.vis button.on{background:var(--pri);color:var(--pill-tx)}
.filt{display:inline-flex;gap:6px}
.filt button{border:1px solid var(--ln);background:var(--sf)}
.filt button.on{background:var(--tx);border-color:var(--tx);color:var(--sf)}
.cards .gt{font-size:13px;font-weight:600;color:var(--mu);margin:4px 2px 10px;display:flex;gap:8px;align-items:baseline}
.cards .gt span{font-weight:400;color:var(--dim);font-size:12px}
.cards .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .25s;display:flex;flex-direction:column;gap:10px;position:relative}
.card:hover{border-color:var(--ln2);box-shadow:0 6px 18px -12px var(--sombra)}
.card.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.card.dimmed{opacity:.35}.card.hide{display:none}
.card.st-er,.card.st-nr{border-color:var(--acao-er-ln)}.card.st-late{border-color:var(--acao-late-ln)}
.card .c1{display:flex;align-items:flex-start;gap:10px}
.card .nm3{font-weight:600;font-size:15px;line-height:1.25}.card .tp{font-size:12px;color:var(--dim);margin-top:2px}
.chip{margin-left:auto;font-size:12px;font-weight:600;border-radius:9999px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:#22C55E1F}.chip.late{background:var(--acao-late-bg)}.chip.er,.chip.nr{background:var(--acao-er-bg)}
.chip.run{background:#0055FF14}.chip.off,.chip.none{background:var(--sf2)}
.card .msg{font-size:13.5px;color:var(--tx);min-height:20px}
.batidas{display:grid;gap:2px;height:26px;align-items:end}
.batidas i{border-radius:2px;background:var(--ok-cel);height:100%}
.batidas i.late{background:var(--late-cel);height:60%}.batidas i.er,.batidas i.nr{background:var(--er-cel)}
.batidas i.none{background:var(--cel-none)}.batidas i.run{background:var(--pri)}
.bleg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:-4px}
.st4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln);padding-top:9px;gap:6px}
.st4 .l{font-size:11.5px;color:var(--dim);white-space:nowrap}.st4 .v{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main.aberto .cards .gr{grid-template-columns:1fr}
.main.aberto .card .batidas,.main.aberto .card .bleg,.main.aberto .card .st4,.main.aberto .card .msg{display:none}
/* topo: a frase é o filtro */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:16px;flex-wrap:wrap}
.frase{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.frase button{border-bottom:2px solid transparent;transition:border-color .2s}
.frase button:hover,.frase button.on{border-color:currentColor}
.frase .sep{color:var(--ln2);font-weight:400}
.sub{color:var(--mu);font-size:13px;margin-top:6px}
.meta{min-width:280px;text-align:right;font-size:13px;color:var(--mu)}
.meta b{color:var(--tx);font-weight:600}
.bar{height:4px;background:var(--ln);border-radius:9999px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--late-cel)}
.bar i.cheia{background:var(--er-cel)}
/* controles */
.ctl{display:flex;gap:16px;align-items:center;margin-bottom:12px;font-size:13px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sf);border:1px solid var(--ln);border-radius:9999px;padding:2px;position:relative}
.seg button{padding:5px 14px;border-radius:9999px;color:var(--mu);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--pill-tx)}
.seg .pill{position:absolute;top:2px;bottom:2px;background:var(--pri);border-radius:9999px;transition:left .35s var(--ease),width .35s var(--ease)}
.busca{background:var(--sf);border:1px solid var(--ln);border-radius:9999px;padding:6px 14px;color:var(--tx);font:inherit;width:220px}
.atalhos{margin-left:auto;color:var(--dim);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
/* principal */
.main{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
.mtx{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.grupo{padding:9px 14px 5px;font-size:11.5px;font-weight:600;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;border-top:1px solid var(--ln)}
.grupo:first-of-type{border-top:0}
.row{display:grid;grid-template-columns:118px 210px 1fr 92px;align-items:center;gap:12px;padding:0 14px;height:44px;border-top:1px solid var(--ln);cursor:pointer;transition:background .15s,opacity .25s}
.row.hd{height:34px;border-top:0;cursor:default;font-size:12px;color:var(--dim)}
.row:not(.hd):hover{background:var(--sf2)}
.row.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--pri)}
.row.dimmed{opacity:.28}.row.hide{display:none}
.st{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st.late i{border-radius:2px}.st.off i,.st.none i{background:none;border:1.5px solid currentColor}
.st.nr i{border-radius:0;transform:rotate(45deg);width:7px;height:7px}
.st.run i{animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{opacity:.3}}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--dim);font-weight:400;margin-left:6px}
.cells{display:grid;gap:3px;height:22px}
.cell{border-radius:3px;background:var(--ok-cel);opacity:.9;transition:transform .15s,opacity .15s}
.cell:hover{transform:scaleY(1.25);opacity:1}
.cells{align-items:end}.cell{height:100%}
.cell.late{background:var(--late-cel);height:55%}
.cell.er{background:repeating-linear-gradient(45deg,var(--er-cel) 0 3px,var(--er-cel2,#ffffff73) 3px 4.5px),var(--er-cel)}.cell.none{background:var(--cel-none);opacity:1}
.cell.pc{background:repeating-linear-gradient(135deg,var(--cel-pc) 0 2px,var(--cel-none) 2px 5px);opacity:1}
.cell.focus{outline:2px solid var(--tx);outline-offset:1px}
.ult{font-family:var(--mono);font-size:12px;color:var(--mu);text-align:right}
.days{display:grid;gap:3px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}.days span{text-align:center}
.leg{display:flex;gap:14px;font-size:12px;color:var(--dim);padding:8px 14px;border-top:1px solid var(--ln);flex-wrap:wrap}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* registro */
.log{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden;align-self:start;max-height:calc(100vh - 220px);overflow-y:auto}
.log h3{margin:0;padding:11px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;position:sticky;top:0;background:var(--sf)}
.log h3 span{font-weight:400;color:var(--dim)}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:7px 14px;border-top:1px solid var(--ln);cursor:pointer;transition:background .15s,opacity .25s}
.ev:first-of-type{border-top:0}.ev:hover,.ev.hl{background:var(--sf2)}.ev.dimmed{opacity:.25}
.ev .t{font-family:var(--mono);font-size:12px;color:var(--dim);padding-top:1px}
.ev .w{font-weight:500}.ev .m{font-size:12.5px;color:var(--mu)}
.ev.er .w,.ev.nr .w{color:var(--er)}.ev.late .w{color:var(--late)}
/* detalhe */
.det{position:absolute;top:0;right:0;width:calc(100% - 372px);background:var(--sf);border:1px solid var(--ln2);border-radius:12px;
 box-shadow:-24px 0 48px -28px var(--sombra);transform:translateX(40px);opacity:0;pointer-events:none;transition:transform .45s var(--ease),opacity .3s var(--ease);z-index:5}
.det.on{transform:none;opacity:1;pointer-events:auto}
.main.aberto .row{grid-template-columns:112px 210px 0 0;gap:8px}
.main.aberto .cells,.main.aberto .ult,.main.aberto .days{visibility:hidden}
.dc{transition:opacity .18s}.dc.troca{opacity:0}
.dh{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px}
.crumb{font-size:13px;color:var(--mu)}.crumb button{color:var(--mu)}.crumb button:hover{color:var(--tx)}.crumb b{color:var(--tx);font-weight:600}
.dt{font-size:20px;font-weight:600;margin:4px 0}
.what{font-size:13.5px;color:var(--mu);max-width:72ch}
.acao{margin:10px 18px 0;padding:10px 12px;border-radius:12px;background:var(--acao-er-bg);border:1px solid var(--acao-er-ln);color:var(--acao-er-tx);font-size:13.5px}
.acao.late{background:var(--acao-late-bg);border-color:var(--acao-late-ln);color:var(--acao-late-tx)}
.acao b{font-weight:600;color:var(--er)}.acao.late b{color:var(--late)}
.x{margin-left:auto;color:var(--mu);font-size:13px;border:1px solid var(--ln2);border-radius:9999px;padding:3px 12px;flex:none}.x:hover{color:var(--tx);border-color:var(--mu)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 18px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.nums>div{padding:10px 12px 10px 0}.nums>div+div{padding-left:14px;border-left:1px solid var(--ln)}
.nums .v{font-size:22px;font-weight:600;white-space:nowrap}.nums .l{font-size:12.5px;color:var(--mu)}.nums .c{font-size:12px;color:var(--dim)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 18px 6px;font-size:13px;font-weight:600;gap:12px}
.sec span{font-weight:400;color:var(--dim);font-size:12px}
.chart{margin:0 18px;position:relative}
svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--sf);border:1px solid var(--ln2);border-radius:8px;padding:5px 9px;font-size:12.5px;opacity:0;transition:opacity .1s;white-space:nowrap;box-shadow:0 4px 14px -6px var(--sombra);z-index:3}

.rd{border-top:1px solid var(--ln);font-size:13px}

const AGORA=new Date(D.gerado);

const dia=n=>{const d=new Date(AGORA);d.setDate(d.getDate()-n);return d};

/* topo */

}

 const ps=[parte('er',n=>n+(n>1?' falharam':' falhou')),parte('nr',n=>n+' não '+(n>1?'rodaram':'rodou')),parte('late',n=>n+(n>1?' atrasados':' atrasado')),parte('run',n=>n+' rodando'),parte('off',n=>n+(n>1?' desligados':' desligado')),parte('ok',n=>n+' normais'),parte('none',n=>n+' sem rodada')].filter(Boolean);

/* matriz */
const GRP={atencao:['er','nr','late'],func:['ok','run']};
function visiveis(){return ITENS.filter(i=>(!S.filtro||i.st===S.filtro)&&(!S.grupo||GRP[S.grupo].includes(i.st))&&(!S.busca||(i.nome+' '+i.k+' '+i.area).toLowerCase().includes(S.busca)));}
function matriz(){const n=S.per,cols=`repeat(${n},1fr)`;
 let h=`<div class="row hd"><span>Status</span><span>Nome</span><div class="days" style="grid-template-columns:${cols}">${
  Array.from({length:n},(_,j)=>{const i=n-1-j;return `<span>${n<=14||i%5===0?(i===0?'hoje':fmt(dia(i)).slice(0,2)):''}</span>`}).join('')}</div><span style="text-align:right">Última</span></div>`;
 const vis=visiveis();let grupo=null;

  if(it.area!==grupo&&!hide){grupo=it.area;h+=`<div class="grupo">${esc(grupo||'Outros')}</div>`;}
  const cells=Array.from({length:n},(_,j)=>{const i=n-1-j,s=it.dias[i];
   return `<div class="cell ${s==='ok'?'':s} ${S.aberto===it.k&&S.diaFoco===i?'focus':''}" data-i="${i}" title="${fmt(dia(i))} · ${RS[s]||s}${it.vol[i]?' · '+it.vol[i]:''}"></div>`}).join('');
  h+=`<div class="row ${hide?'hide':''} ${S.aberto===it.k?'sel':''}" data-k="${it.k}" tabindex="-1">
   <span class="st ${it.st}"><i></i>${ROT[it.st]||it.st}</span><span class="nm" title="${esc(it.motivo)}">${esc(it.nome)}<small>${esc(it.tipo)}</small></span>
   <div class="cells" style="grid-template-columns:${cols}">${cells}</div><span class="ult">${esc(it.ult)}</span></div>`;});
 h+=`<div class="leg"><span><i style="background:var(--ok-cel)"></i>ok</span><span><i style="background:var(--late-cel);height:7px;align-self:end"></i>atraso</span><span><i style="background:repeating-linear-gradient(45deg,var(--er-cel) 0 3px,#ffffff73 3px 4.5px),var(--er-cel)"></i>falha ou não rodou</span><span><i style="background:repeating-linear-gradient(135deg,var(--cel-pc) 0 2px,var(--cel-none) 2px 5px)"></i>computador desligado (fora da meta)</span><span><i style="background:var(--cel-none)"></i>nada esperado</span></div>`;
 const m=document.getElementById('mtx');m.innerHTML=h;
 m.querySelectorAll('.row[data-k]').forEach(r=>{r.onclick=e=>{const c=e.target.closest('.cell');abre(r.dataset.k,c?+c.dataset.i:null);};
  r.onmouseenter=()=>liga(r.dataset.k);r.onmouseleave=()=>liga(null);});}

/* registro de hoje */
function registro(){const vis=visiveis().map(i=>i.k);const ev=EV.filter(e=>vis.includes(e[1]));
 document.getElementById('log').innerHTML=`<h3>Hoje <span>${ev.length} ${ev.length===1?'evento':'eventos'}</span></h3>`+(ev.length?
  ev.map(([t,k,s,w,m])=>`<div class="ev ${s}" data-k="${k}"><span class="t">${t}</span><div><div class="w">${esc(w)}</div><div class="m">${esc(m)}</div></div></div>`).join(''):'<div class="vazio" style="padding:12px 14px">Nada rodou hoje ainda.</div>');
 document.querySelectorAll('.ev').forEach(e=>{e.onmouseenter=()=>liga(e.dataset.k);e.onmouseleave=()=>liga(null);e.onclick=()=>abre(e.dataset.k,0);});}
function liga(k){document.querySelectorAll('.card').forEach(r=>r.classList.toggle('dimmed',!!k&&r.dataset.k!==k&&!S.aberto));document.querySelectorAll('.row[data-k]').forEach(r=>r.classList.toggle('dimmed',!!k&&r.dataset.k!==k&&!S.aberto));

/* gráfico: uma série, faixa do normal (p25–p75), pontos de falha, marcas de mudança, cursor + dica */
function q(vs,p){const s=[...vs].sort((a,b)=>a-b);if(!s.length)return 0;const k=(s.length-1)*p,a=Math.floor(k),b=Math.min(a+1,s.length-1);return s[a]+(s[b]-s[a])*(k-a);}
function grafico(it){const n=Math.max(S.per,7),W=1000,H=120,v=Array.from({length:n},(_,j)=>it.vol[n-1-j]??0),max=Math.max(...v,1),dx=(W-8)/(n-1),y=x=>H-x/max*(H-10);
 const base=it.vol.slice(1,29).filter((x,i)=>it.dias[i+1]!=='none'&&it.dias[i+1]!=='pc'),lo=q(base,.25),hi=q(base,.75);
 const pts=v.map((val,i)=>[4+i*dx,y(val)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const foco=S.diaFoco!=null&&S.diaFoco<n?n-1-S.diaFoco:null;
 const dots=pts.map((p,i)=>{const s=it.dias[n-1-i];return s==='er'||s==='late'?`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--${s==='late'?'late':'er'})" stroke="var(--sf)" stroke-width="2"/>`:''}).join('');
 const marcas=(D.marcas||[]).filter(m=>!m.item||m.item===it.k).map(m=>{const i=Math.round((AGORA-new Date(m.data+'T12:00'))/864e5);if(i<0||i>=n)return '';const x=4+(n-1-i)*dx;
  return `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--dim)" stroke-dasharray="1 3"/><text x="${x+4}" y="10" fill="var(--dim)" font-size="11">${esc(m.texto)}</text>`}).join('');
 const faixa=base.length>=5&&hi>0?`<rect x="0" width="${W}" y="${y(hi)}" height="${Math.max(1,y(lo)-y(hi))}" fill="var(--faixa)"/><text x="${W}" y="${y(hi)-4}" text-anchor="end" fill="var(--dim)" font-size="11">normal ${Math.round(lo)}–${Math.round(hi)}</text>`:'';
 return `<svg viewBox="0 0 ${W} ${H+16}" id="gsvg" role="img" aria-label="${esc(it.volNome)}">${faixa}<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--grid)"/>${marcas}
 <path d="${d}" fill="none" stroke="var(--linha)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}
 ${foco!=null?`<line x1="${pts[foco][0]}" x2="${pts[foco][0]}" y1="0" y2="${H}" stroke="var(--foco)" stroke-dasharray="3 3"/><circle cx="${pts[foco][0]}" cy="${pts[foco][1]}" r="5" fill="var(--foco)"/>`:''}
 <line id="gx" y1="0" y2="${H}" stroke="var(--cursor)" stroke-dasharray="2 3" opacity="0"/>
 <text x="0" y="${H+14}" fill="var(--eixo)" font-size="11">${fmt(dia(n-1))}</text><text x="${W}" y="${H+14}" fill="var(--eixo)" font-size="11" text-anchor="end">hoje</text><text x="0" y="10" fill="var(--eixo)" font-size="11">${max}</text>
 <rect width="${W}" height="${H}" fill="transparent" id="ghit" style="cursor:pointer"/></svg><div class="tip" id="gtip"></div>`;}
function duracoes(it){if(!it.durs||it.durs.length<3)return '';const v=it.durs,W=1000,H=60,max=Math.max(...v),dx=(W-8)/(v.length-1);
 const d=v.map((x,i)=>(i?'L':'M')+(4+i*dx).toFixed(1)+' '+(H-x/max*(H-8)).toFixed(1)).join(' ');
 const fm=s=>s<60?s+' s':Math.round(s/60)+' min';
 return `<div class="sec">Duração das últimas ${v.length} rodadas<span>p95 ${fm(Math.round(q(v,.95)))} · mediana ${fm(Math.round(q(v,.5)))}</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H+4}"><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--grid)"/><path d="${d}" fill="none" stroke="var(--linha)" stroke-width="2" stroke-linejoin="round"/><text x="0" y="10" fill="var(--eixo)" font-size="11">${fm(max)}</text></svg></div>`;}
function rodadas(it){const i=S.diaFoco??0,s=it.dias[i],d=fmt(dia(i)),rs=it.rodadas[String(i)]||[];
 if(!rs.length)return `<div class="vazio">${s==='pc'?d+': o computador estava desligado, a rotina não tinha como rodar. Não conta na meta.':'Nada em '+d+'.'}</div>`;
 return rs.map(([t,ss,m,du,tr,arq])=>`<details class="rd"><summary><span class="t">${d} ${t}</span><span class="s ${ss}">${ROT[ss]||RS[ss]||ss}</span><span>${esc(m)}</span><span class="d">${esc(du)}</span></summary>${arq?`<div class="arq">${esc(arq)}</div>`:''}${tr?`<pre>${esc(tr)}</pre>`:''}</details>`).join('');}
function detalhe(it){const i=S.diaFoco;
 return `<div class="dh"><div><div class="crumb"><button data-a="fecha">Todos</button> / <b>${esc(it.nome)}</b>${i!=null?` / ${fmt(dia(i))}`:''}</div>
  <div class="dt"><span class="st ${it.st}" style="display:inline-flex;font-size:14px;margin-right:8px"><i></i>${ROT[it.st]||it.st}</span><span style="font-size:14px;font-weight:400;color:var(--mu)">${esc(it.motivo)}</span></div>
  <div class="what">${esc(it.oque)}</div></div><button class="x" data-a="fecha">Esc</button></div>
 ${it.acao?`<div class="acao ${it.st==='late'?'late':''}">${it.acao}</div>`:''}
 <div class="nums">${it.nums.map(([v,l,c])=>`<div><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div><div class="c">${esc(c)}</div></div>`).join('')}</div>
 <div class="sec">${esc(it.volNome)}<span>clique num dia para ver as rodadas dele</span></div><div class="chart">${grafico(it)}</div>
 ${duracoes(it)}
 <div class="sec">Rodadas de ${fmt(dia(i??0))}${i==null||i===0?' (hoje)':''}<span><kbd>←</kbd> <kbd>→</kbd> dia anterior / seguinte · clique para ver o registro</span></div><div class="runs">${rodadas(it)}</div>`;}
function ligaDetalhe(it){const dc=document.getElementById('dc');dc.querySelectorAll('[data-a="fecha"]').forEach(b=>b.onclick=fecha);
 const svg=dc.querySelector('#gsvg');if(!svg)return;const n=Math.max(S.per,7),W=1000,tip=dc.querySelector('#gtip'),gx=svg.querySelector('#gx');
 const idx=e=>{const b=svg.getBoundingClientRect();return Math.max(0,Math.min(n-1,Math.round(((e.clientX-b.left)/b.width*W-4)/((W-8)/(n-1)))))};
 const hit=svg.querySelector('#ghit');
 hit.onmousemove=e=>{const j=idx(e),i=n-1-j,b=svg.getBoundingClientRect(),x=4+j*(W-8)/(n-1);gx.setAttribute('x1',x);gx.setAttribute('x2',x);gx.setAttribute('opacity',1);
  tip.innerHTML=`${fmt(dia(i))}: <b>${it.vol[i]??0}</b> · ${RS[it.dias[i]]||''}`;tip.style.opacity=1;tip.style.left=Math.min(x/W*b.width+10,b.width-200)+'px';tip.style.top='4px';};
 hit.onmouseleave=()=>{gx.setAttribute('opacity',0);tip.style.opacity=0;};
 hit.onclick=e=>{S.diaFoco=n-1-idx(e);atualizaDetalhe(false);};}
const det=document.getElementById('det'),main=document.getElementById('main');
function atualizaDetalhe(troca){const it=ITENS.find(i=>i.k===S.aberto);if(!it){fecha();return;}const dc=document.getElementById('dc');
 const pinta=()=>{dc.innerHTML=detalhe(it);ligaDetalhe(it);dc.classList.remove('troca');};
 if(troca&&det.classList.contains('on')){dc.classList.add('troca');setTimeout(pinta,160);}else pinta();matriz();cartoes();salva();}
function abre(k,i){if(S.aba!=='agentes')mostraAba('agentes');const novo=S.aberto!==k;S.aberto=k;S.diaFoco=i;S.sel=ITENS.findIndex(x=>x.k===k);
 const ja=det.classList.contains('on');main.classList.add('aberto');det.classList.add('on');atualizaDetalhe(ja&&novo);liga(null);}
function fecha(){S.aberto=null;S.diaFoco=null;det.classList.remove('on');main.classList.remove('aberto');matriz();cartoes();salva();}

const per=document.getElementById('per'),pill=per.querySelector('.pill');
function movePill(){const b=per.querySelector('button.on');if(!b)return;pill.style.left=b.offsetLeft+'px';pill.style.width=b.offsetWidth+'px';}
per.querySelectorAll('button').forEach(b=>b.onclick=()=>{per.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));S.per=+b.dataset.d;movePill();render();});

/* teclado */
const busca=document.getElementById('busca');busca.oninput=()=>{S.busca=busca.value.toLowerCase();render();};
document.addEventListener('keydown',e=>{
 if(e.target!==busca&&(e.key==='1'||e.key==='2')){mostraAba(e.key==='1'?'geral':'agentes');return;}
 if(e.target===busca){if(e.key==='Escape'){busca.value='';S.busca='';busca.blur();render();}return;}
 const vis=visiveis();if(!vis.length)return;let pos=vis.findIndex(i=>i.k===(S.aberto||ITENS[S.sel]?.k));if(pos<0)pos=0;
 if(e.key==='/'){e.preventDefault();busca.focus();}
 else if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();const it=vis[Math.min(vis.length-1,pos+1)];S.sel=ITENS.indexOf(it);S.aberto?abre(it.k,S.diaFoco):marca();}
 else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();const it=vis[Math.max(0,pos-1)];S.sel=ITENS.indexOf(it);S.aberto?abre(it.k,S.diaFoco):marca();}
 else if(e.key==='Enter'){abre(ITENS[S.sel].k,null);}
 else if(e.key==='t'||e.key==='T'){tema(document.documentElement.dataset.tema==='noite'?'dia':'noite');}
 else if(e.key==='Escape'){if(S.diaFoco!=null&&S.aberto){S.diaFoco=null;atualizaDetalhe(false);}else if(S.aberto)fecha();else{S.filtro=null;render();}}
 else if(S.aberto&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();let i=S.diaFoco??0;i=e.key==='ArrowLeft'?Math.min(29,i+1):Math.max(0,i-1);S.diaFoco=i;atualizaDetalhe(false);}
});
function marca(){document.querySelectorAll('.card').forEach(r=>r.classList.toggle('sel',r.dataset.k===ITENS[S.sel]?.k));document.querySelectorAll('.row[data-k]').forEach(r=>r.classList.toggle('sel',r.dataset.k===ITENS[S.sel]?.k));}

/* tema: lembra a escolha neste navegador */
function tema(t){document.documentElement.dataset.tema=t;document.querySelectorAll('#tema button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});try{localStorage.setItem('vigia-tema',t)}catch(e){}}
document.querySelectorAll('#tema button').forEach(b=>b.onclick=()=>tema(b.dataset.t));
let t0='dia';try{t0=localStorage.getItem('vigia-tema')||'dia'}catch(e){}tema(t0);

/* versão + aviso de versão nova (só quando há internet; falha em silêncio) */
document.getElementById('versao').textContent='versão '+D.versao;
if(D.repo){fetch('https://api.github.com/repos/'+D.repo+'/releases/latest').then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.tag_name)return;
 const novo=j.tag_name.replace(/^v/,''),cmp=(a,b)=>a.split('.').map(Number).reduce((s,x,i)=>s||x-(b.split('.').map(Number)[i]||0),0);
 if(cmp(novo,D.versao)>0){const a=document.getElementById('novov');a.style.display='inline-block';a.href=j.html_url;a.textContent='versão '+novo+' disponível · rode: vigia atualizar';}}).catch(()=>{});}
document.getElementById('rodape').innerHTML=`<span>${ITENS.length} itens monitorados</span><span>gerado ${AGORA.toLocaleString('pt-BR')}</span><span>só leitura: o painel não liga, desliga nem reroda nada</span>`;


/* ======== abas ======== */
function mostraAba(a){S.aba=a;document.querySelectorAll('#abas button').forEach(b=>{const on=b.dataset.aba===a;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
 document.querySelectorAll('.aba').forEach(x=>x.classList.toggle('on',x.id==='aba-'+a));if(a==='agentes')setTimeout(movePill,0);salva();}
document.querySelectorAll('#abas button').forEach(b=>b.onclick=()=>{mostraAba(b.dataset.aba);if(b.dataset.aba==='geral'&&S.aberto)fecha();});

/* ======== visão geral ======== */
const RUIM=s=>s==='er'||s==='nr', BOM=s=>s==='ok'||s==='late';
function geral(){
 const prob=ITENS.filter(i=>['er','nr','late'].includes(i.st));
 const ct=document.getElementById('ct-ag');ct.textContent=prob.length?prob.length+' com alerta':ITENS.length;ct.className='ct'+(prob.length?' er':'');
 // números gerais
 const evH=EV.filter(e=>e[2]!=='pc'), okH=evH.filter(e=>e[2]==='ok').length, ruimH=evH.filter(e=>RUIM(e[2])).length;
 const prox=ITENS.filter(i=>i.prox).map(i=>({i,d:new Date(i.prox)})).sort((a,b)=>a.d-b.d);
 const rel=d=>{let m=Math.round((d-Date.now())/60000);if(m<1)return 'agora';if(m<60)return 'em '+m+' min';const h=Math.floor(m/60);return 'em '+h+'h'+String(m%60).padStart(2,'0');};
 const folga=D.folga_usada==null?null:Math.round(Math.min(1,D.folga_usada)*100);
 const k=[
  ['Sucesso no mês',D.sucesso_mes==null?'—':pct(D.sucesso_mes),`meta ${Math.round(D.meta*100)}% · ${folga==null?'':(D.folga_usada>1?'estourou a folga':folga+'% da folga usada')}`],
  ['Com alerta agora',`${prob.length}<small> de ${ITENS.length}</small>`,prob.length?prob.map(i=>i.nome).slice(0,2).join(', ')+(prob.length>2?'…':''):'nenhum'],
  ['Rodadas hoje',`${okH}<small> ok</small>`,ruimH?`${ruimH} com falha`:'nenhuma falha hoje'],
  ['Próxima execução',prox.length?`<span data-rel="${prox[0].d.toISOString()}">${rel(prox[0].d)}</span>`:'—',prox.length?prox[0].i.nome:''],
  ['Computador desligado',`${D.pc_dias}<small> ${D.pc_dias===1?'dia':'dias'}</small>`,'nos últimos 30 dias · fora da meta'],
 ];
 document.getElementById('kpis').innerHTML=k.map(([l,v,c],j)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="c">${esc(c)}</div></div>`).join('');
 // precisa de você
 const ord={er:0,nr:1,late:2};prob.sort((a,b)=>ord[a.st]-ord[b.st]);
 document.getElementById('pend-n').textContent=prob.length?prob.length+(prob.length>1?' itens':' item'):'';
 document.getElementById('pend').innerHTML=prob.length?prob.map(i=>`<div class="pend" data-k="${i.k}"><span class="st ${i.st}"><i></i>${ROT[i.st]}</span><div><div class="n">${esc(i.nome)}</div><div class="a">${i.acao||esc(i.motivo)}</div></div><span class="ir">abrir →</span></div>`).join('')
  :'<div class="limpo">Nada precisando de você agora.</div>';
 document.querySelectorAll('.pend').forEach(p=>p.onclick=()=>abre(p.dataset.k,null));
 // por área
 const areas={};ITENS.forEach(i=>{(areas[i.area||'Outros']=areas[i.area||'Outros']||[]).push(i)});
 document.getElementById('areas').innerHTML=Object.entries(areas).sort().map(([a,its])=>{
  const c={};its.forEach(i=>c[i.st]=(c[i.st]||0)+1);
  const cont=['er','nr','late','ok','off','none'].filter(s=>c[s]).map(s=>`<span class="${s}"><span class="st ${s}" style="gap:0"><i></i></span>${c[s]} ${ROT[s].toLowerCase()}</span>`).join('');
  const cel=Array.from({length:14},(_,j)=>{const d=13-j;const v=its.map(i=>i.dias[d]).filter(x=>x==='ok'||x==='late'||x==='er');
   if(!v.length){const pc=its.some(i=>i.dias[d]==='pc');return `<i style="${pc?'background:repeating-linear-gradient(135deg,var(--cel-pc) 0 2px,var(--cel-none) 2px 5px)':''}" title="${fmt(dia(d))} · ${pc?'computador desligado':'nada esperado'}"></i>`;}
   const ok=v.filter(BOM).length/v.length;return `<i style="background:${ok>=1?'var(--ok-cel)':ok>=.8?'var(--late-cel)':'var(--er-cel)'}" title="${fmt(dia(d))} · ${Math.round(ok*100)}% ok (${v.length} itens)"></i>`;}).join('');
  return `<div class="ar" data-a="${esc(a)}"><div class="nm2">${esc(a)}<small>${its.length} ${its.length>1?'itens':'item'}</small></div><div class="cont">${cont}</div><div class="mini">${cel}</div></div>`}).join('');
 document.querySelectorAll('.ar').forEach(r=>r.onclick=()=>{S.busca=r.dataset.a.toLowerCase();document.getElementById('busca').value=r.dataset.a;mostraAba('agentes');render();});
 // calendário do mês: % de item×dia ok (uma cor, do claro ao escuro), computador desligado hachurado
 const ini=new Date(AGORA.getFullYear(),AGORA.getMonth(),1),nd=new Date(AGORA.getFullYear(),AGORA.getMonth()+1,0).getDate();
 document.getElementById('cal-t').innerHTML=`${AGORA.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())} <span>% de itens ok por dia</span>`;
 let h='<div class="sem">'+['seg','ter','qua','qui','sex','sáb','dom'].map(x=>`<span>${x}</span>`).join('')+'</div><div class="dias">';
 const off=(ini.getDay()+6)%7;for(let j=0;j<off;j++)h+='<div class="d vz"></div>';
 const rampa=['var(--cal-1,#FDE2E2)','var(--cal-2,#FCE7C8)','var(--cal-3,#D7F0DF)','var(--cal-4,#9FDDB3)','var(--cal-5,#22A35A)'];
 for(let n=1;n<=nd;n++){const dd=new Date(AGORA.getFullYear(),AGORA.getMonth(),n),idx=Math.round((new Date(AGORA.toDateString())-dd)/864e5);
  if(idx<0){h+=`<div class="d" style="opacity:.45">${n}</div>`;continue;}
  const v=ITENS.map(i=>i.dias[idx]).filter(x=>x==='ok'||x==='late'||x==='er');const pc=ITENS.some(i=>i.dias[idx]==='pc');
  if(!v.length){h+=`<div class="d ${pc?'pc':''} ${idx===0?'hoje':''}" title="${fmt(dd)} · ${pc?'computador desligado':'nada esperado'}">${n}</div>`;continue;}
  const ok=v.filter(BOM).length/v.length,cor=ok>=1?rampa[4]:ok>=.95?rampa[3]:ok>=.85?rampa[2]:ok>=.7?rampa[1]:rampa[0];
  h+=`<div class="d ${idx===0?'hoje':''}" style="background:${cor};${ok>=1?'color:#fff':''}" title="${fmt(dd)} · ${Math.round(ok*100)}% ok · ${v.length-v.filter(BOM).length} com falha${pc?' · computador desligado parte do dia':''}">${n}<span class="p">${Math.round(ok*100)}</span></div>`;}
 h+=`</div><div class="leg2">menos <i style="background:${rampa[0]}"></i><i style="background:${rampa[1]}"></i><i style="background:${rampa[2]}"></i><i style="background:${rampa[3]}"></i><i style="background:${rampa[4]}"></i> 100% · <i style="background:repeating-linear-gradient(135deg,var(--cel-pc) 0 2px,var(--cel-none) 2px 5px)"></i> computador desligado · <i style="background:var(--cel-none)"></i> nada esperado</div>`;
 document.getElementById('cal').innerHTML=h;
 // saúde
 const sd=D.saude||[];document.getElementById('saude').innerHTML=sd.length?sd.map(x=>`<div class="s"><span class="st ${x.st}" style="gap:0"><i></i></span><b>${esc(x.nome)}</b><span>${esc(x.txt)}</span></div>`).join(''):'<div class="vazio" style="padding:12px 16px">Sem verificações configuradas.</div>';
 // próximas
 document.getElementById('prox').innerHTML=prox.slice(0,6).map(x=>`<div class="p2"><span class="t">${x.d.toDateString()===AGORA.toDateString()?'':fmt(x.d)+' '}${x.d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><span>${esc(x.i.nome)} <span class="dim">· <span data-rel="${x.d.toISOString()}">${rel(x.d)}</span></span></span></div>`).join('')||'<div class="vazio" style="padding:12px 16px">Nenhuma rotina agendada.</div>';
 setInterval(()=>document.querySelectorAll('[data-rel]').forEach(e=>e.textContent=rel(new Date(e.dataset.rel))),30000);
}
/* cartões: barra das últimas rodadas + disponibilidade, última, próxima, duração (como na Central de Agentes) */
function batidas(it){let b=[];let rot='rodadas';
 // agente de banco: um traço por dia (não tem "rodada"; mostrar gravação antiga como batida engana)
 if(it.tipo!=='agente')for(let i=29;i>=0;i--){const rs=it.rodadas[String(i)]||[];rs.forEach(r=>b.push(r[1]));}
 if(b.length<8){b=Array.from({length:30},(_,j)=>it.dias[29-j]).filter(s=>s!=='pc');rot='dias';}
 b=b.slice(-40);return {b,rot};}
function disp7(it){let ok=0,t=0;for(let i=0;i<7;i++){const s=it.dias[i];if(s==='ok'){ok++;t++;}else if(s==='er'||s==='nr'||s==='late'){t++;}}return t?Math.round(ok/t*100)+'%':'—';}
function durMed(it){if(!it.durs||!it.durs.length)return null;const m=it.durs.reduce((a,b)=>a+b,0)/it.durs.length;return m<60?Math.round(m)+' s':m<3600?Math.round(m/60)+' min':(m/3600).toFixed(1).replace('.',',')+' h';}
function proxTxt(it){if(!it.prox)return it.tipo==='agente'?'contínuo':'—';const d=new Date(it.prox),min=Math.round((d-Date.now())/60000);return min<=0?'agora':min<60?'em '+min+' min':min<1440?'em '+Math.floor(min/60)+'h'+String(min%60).padStart(2,'0'):fmt(d)+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function cartoes(){const vis=visiveis();let h='',grupo=null,aberto=false;
 const ord=[...ITENS].sort((a,b)=>(a.area||'').localeCompare(b.area||''));
 const n=a=>ord.filter(x=>x.area===a&&vis.includes(x)).length;
 ord.forEach(it=>{const hide=!vis.includes(it);
  if(it.area!==grupo&&!hide){if(aberto)h+='</div>';grupo=it.area;h+=`<div class="gt">${esc(grupo||'Outros')}<span>${n(grupo)} ${n(grupo)===1?'item':'itens'}</span></div><div class="gr">`;aberto=true;}
  if(hide)return;
  const {b,rot}=batidas(it),dm=durMed(it);
  const quarto=it.tipo==='agente'?['Hoje',String(it.vol[0]??0)]:['Duração média',dm||'—'];
  h+=`<div class="card st-${it.st} ${S.aberto===it.k?'sel':''}" data-k="${it.k}" tabindex="0">
   <div class="c1"><div><div class="nm3">${esc(it.nome)}</div><div class="tp">${esc(it.tipo)}</div></div><span class="chip ${it.st} ${it.st==='nr'?'er':it.st}"><i></i>${ROT[it.st]||it.st}</span></div>
   <div class="msg">${esc(it.motivo||'')}</div>
   <div class="batidas" style="grid-template-columns:repeat(${Math.max(b.length,1)},1fr)" title="últimas ${b.length} ${rot}">${b.map(s=>`<i class="${s==='ok'?'':s}"></i>`).join('')}</div>
   <div class="bleg"><span>últimas ${b.length} ${rot}</span><span>agora</span></div>
   <div class="st4"><div><div class="l">Disponib. 7d</div><div class="v">${disp7(it)}</div></div><div><div class="l">Última</div><div class="v">${esc(it.ult)}</div></div><div><div class="l">Próxima</div><div class="v">${proxTxt(it)}</div></div><div><div class="l">${quarto[0]}</div><div class="v">${esc(quarto[1])}</div></div></div>
  </div>`;});
 if(aberto)h+='</div>';
 if(!vis.length)h='<div class="vazio" style="padding:16px">Nada com esse filtro.</div>';
 const c=document.getElementById('cards');c.innerHTML=h;
 c.querySelectorAll('.card').forEach(el=>{el.onclick=()=>abre(el.dataset.k,null);el.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();abre(el.dataset.k,null);}};
  el.onmouseenter=()=>liga(el.dataset.k);el.onmouseleave=()=>liga(null);});}
function visao(){const v=S.vis;document.getElementById('cards').style.display=v==='cartoes'?'':'none';document.getElementById('mtx').style.display=v==='tabela'?'':'none';
 document.querySelectorAll('#vis button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.querySelectorAll('#filt button').forEach(b=>b.classList.toggle('on',(b.dataset.g||null)===S.grupo));
 document.getElementById('per').style.display=v==='tabela'?'':'none';}
S.grupo=null;S.vis='cartoes';try{S.vis=localStorage.getItem('vigia-visao')||'cartoes'}catch(e){}
document.querySelectorAll('#vis button').forEach(b=>b.onclick=()=>{S.vis=b.dataset.v;try{localStorage.setItem('vigia-visao',S.vis)}catch(e){};render();});
document.querySelectorAll('#filt button').forEach(b=>b.onclick=()=>{S.grupo=b.dataset.g||null;render();});
function render(){topo();frase();matriz();cartoes();visao();registro();if(S.aberto)atualizaDetalhe(false);salva();}
le();per.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.d===S.per));geral();render();mostraAba(S.aba);movePill();
if(S.aberto){main.classList.add('aberto');det.classList.add('on');atualizaDetalhe(false);}else marca();
setInterval(topo,30000);
</script>
</div></body></html>
